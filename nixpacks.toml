[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = [
  "python -m pip install --upgrade pip",
  "pip install -r backend/requirements.txt"
]

# Put backend package root on PYTHONPATH so "app" imports work from repo root
[variables]
PYTHONPATH = "backend"

[start]
cmd = "python -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8080}"
